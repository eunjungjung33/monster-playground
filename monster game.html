<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몬스터 놀이터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one-screen tablet app. Top bar (monster + stars), big tile menu, each game fills the stage. */
:root{
  --bg:#fff7e0; --fg:#3b2a1a; --card:#ffffff; --muted:#8a6f52; --line:#e9d9b8;
  --accent:#ff7a3d; --accent2:#4fb3ff; --good:#4cc26e; --bad:#ff5c7a; --star:#ffc93c;
  --display:'Jua','Fredoka',system-ui,sans-serif; --en:'Fredoka','Jua',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;overflow-x:hidden;touch-action:manipulation}
*{box-sizing:border-box}
button,canvas,.pz,.choices,.pick{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--accent2);outline-offset:2px}
.screen{display:flex;flex-direction:column;gap:16px;max-width:900px;margin:0 auto;min-height:100%}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15;font-weight:400}
h1{font-size:clamp(2rem,6vw,3.2rem)}
h2{font-size:clamp(1.5rem,4.5vw,2.2rem)}
h3{font-size:1.25rem;color:var(--muted)}
.big{min-height:64px;padding:12px 28px;border-radius:999px;background:var(--accent);color:#fff;font-size:1.4rem;
  box-shadow:0 6px 0 #c9541e;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c9541e}
.big.blue{background:var(--accent2);box-shadow:0 6px 0 #2b7fc0}.big.blue:active{box-shadow:0 2px 0 #2b7fc0}
.big.green{background:var(--good);box-shadow:0 6px 0 #2f8f4c}.big.green:active{box-shadow:0 2px 0 #2f8f4c}
.big.pink{background:var(--bad);box-shadow:0 6px 0 #b8324d}.big.pink:active{box-shadow:0 2px 0 #b8324d}
.ghost{background:transparent;color:var(--muted);font-size:1.1rem;padding:8px 14px;border-radius:12px}
.ghost:active{background:#f3e5c8}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .mon{width:72px;height:72px;flex:none}
.top .mon svg{width:100%;height:100%}
.top .name{font-size:1.5rem}
.stars{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);padding:8px 16px;border-radius:999px;
  box-shadow:0 3px 0 var(--line);font-family:var(--en);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stars .s{color:var(--star);font-size:1.6rem}
.tclock{display:flex;align-items:center;gap:6px;background:var(--card);padding:8px 16px;border-radius:999px;box-shadow:0 3px 0 var(--line);
  font-family:var(--en);font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.tclock b{font-weight:700}
.tclock.low{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.tclock.low{animation:none}}

/* quest progress */
.quest{background:var(--card);border-radius:24px;padding:16px 20px;box-shadow:0 4px 0 var(--line)}
.quest .track{height:26px;border-radius:999px;background:#f3e5c8;overflow:hidden;margin-top:10px}
.quest .fill{height:100%;background:linear-gradient(90deg,var(--star),var(--accent));border-radius:999px;transition:width .4s}
.quest small{color:var(--muted);font-size:1rem}

/* menu */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tile{background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 6px 0 var(--line);font-size:1.6rem;min-height:190px;justify-content:center;transition:transform .08s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.tile .ico{font-size:3.4rem;line-height:1}
.tile small{font-family:var(--en);font-size:1rem;color:var(--muted)}
.tile.locked{opacity:.6}

/* name screen + maker */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-block:20px}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pick button{background:var(--card);border-radius:24px;padding:10px;width:130px;box-shadow:0 5px 0 var(--line);border:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:1.1rem}
.pick button.on{border-color:var(--accent)}
.pick svg{width:100%;height:auto}
.namebox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input#nameIn{font:inherit;font-size:1.6rem;padding:10px 18px;border-radius:18px;border:4px solid var(--line);background:#fff;
  width:min(300px,80vw);text-align:center}
.maker{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:20px;width:100%;align-items:start}
.maker .preview{background:var(--card);border-radius:28px;padding:12px;box-shadow:0 6px 0 var(--line);position:sticky;top:8px}
.maker .preview svg{width:100%;height:auto}
.parts{display:flex;flex-direction:column;gap:14px;min-width:0}
.part{background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--line)}
.part .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.part .opts button{width:64px;height:64px;border-radius:16px;background:#fff7e0;border:4px solid transparent;padding:4px;display:grid;place-items:center}
.part .opts button.on{border-color:var(--accent);background:#fff}
.part .opts button svg{width:100%;height:100%}
.part .opts button.sw{border-radius:50%}
@media (max-width:600px){.maker{grid-template-columns:1fr}.maker .preview{position:static;max-width:240px;margin:0 auto}}

/* game stage */
.stage{background:var(--card);border-radius:28px;padding:16px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:14px;align-items:center}
.stage .bar{display:flex;width:100%;align-items:center;gap:10px;flex-wrap:wrap}
.stage .bar h2{flex:1}
.msg{font-size:1.4rem;min-height:1.6em;text-align:center}

/* puzzle */
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(420px,88vw);aspect-ratio:1;max-width:100%}
.pz button{border-radius:12px;background-size:300% 300%;border:4px solid transparent;transition:transform .1s}
.pz button.sel{border-color:var(--accent2);transform:scale(.94)}
.pz button.done{border-color:var(--good)}

/* runner */
canvas#run{width:100%;max-width:720px;height:auto;border-radius:18px;touch-action:none;display:block}
.runhint{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-family:var(--en);font-variant-numeric:tabular-nums}

/* sticker sheet */
.sheet{position:relative;width:100%;max-width:720px;aspect-ratio:16/10;background:#fff;border-radius:18px;overflow:hidden;border:6px solid #f3e5c8;touch-action:none}
.sheet .sky,.sheet .grass{position:absolute;left:0;right:0;opacity:0;transition:opacity 1.2s}
.sheet .sky{top:0;height:72%;background:linear-gradient(#bfe9ff,#eaf8ff)}
.sheet .grass{bottom:0;height:28%;background:linear-gradient(#8ee28a,#5fcc7a)}
.sheet.movie .sky,.sheet.movie .grass{opacity:1}
.stk{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;display:grid;place-items:center;cursor:grab;border-radius:14px;border:3px solid transparent}
.stk.sel{border-color:var(--accent2);background:rgba(79,179,255,.12)}
.stk svg{width:60px;height:60px}.stk .em{font-size:48px;line-height:1}
.stk.t-road{width:70%;height:34px}
.roadbar{width:100%;height:28px;background:#4a4a5a;border-radius:6px;background-image:repeating-linear-gradient(90deg,#ffd97a 0 22px,transparent 22px 44px);background-size:100% 4px;background-repeat:no-repeat;background-position:center}
.tray{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:720px;padding:6px 2px;scrollbar-width:thin}
.tray button{flex:none;width:76px;height:84px;border-radius:16px;background:#fff7e0;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tray button svg{width:46px;height:46px}.tray button .em{font-size:38px;line-height:1}.tray button small{font-size:.8rem;color:var(--muted)}
.tray button .roadbar{width:60px;height:16px}
/* the movie: each sticker type gets its own motion when the sheet is playing */
.sheet.movie .stk{border-color:transparent;background:none}
.sheet.movie .t-car,.sheet.movie .t-bus,.sheet.movie .t-bike{animation:drive 7s linear infinite}
.sheet.movie .t-cloud{animation:drift 12s linear infinite}
.sheet.movie .t-bird,.sheet.movie .t-fly{animation:flutter 3s ease-in-out infinite}
.sheet.movie .t-sun{animation:spin 8s linear infinite}
.sheet.movie .t-star,.sheet.movie .t-moon{animation:twinkle 1.4s ease-in-out infinite}
.sheet.movie .t-tree,.sheet.movie .t-tree2,.sheet.movie .t-flower,.sheet.movie .t-tulip{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 100%}
.sheet.movie .t-mon,.sheet.movie .t-bori,.sheet.movie .t-pony,.sheet.movie .t-mochi,.sheet.movie .t-dog,.sheet.movie .t-cat{animation:hop 1.1s ease-in-out infinite}
.sheet.movie .t-house,.sheet.movie .t-house2{animation:wobble 2s ease-in-out infinite}
.sheet.movie .t-rainbow{animation:glow 2s ease-in-out infinite}
@keyframes drive{0%{transform:translate(-50%,-50%) translateX(-60vw)}100%{transform:translate(-50%,-50%) translateX(60vw)}}
@keyframes drift{0%{transform:translate(-50%,-50%) translateX(-40vw)}100%{transform:translate(-50%,-50%) translateX(40vw)}}
@keyframes flutter{0%,100%{transform:translate(-50%,-50%) translate(-30px,0) rotate(-8deg)}50%{transform:translate(-50%,-50%) translate(30px,-25px) rotate(8deg)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.35)}}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(-5deg)}50%{transform:translate(-50%,-50%) rotate(5deg)}}
@keyframes hop{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-22px)}}
@keyframes wobble{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,-50%) rotate(2deg)}}
@keyframes glow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.movie .stk{animation:none}}


/* cake */
.cake{position:relative;width:min(360px,86vw);height:300px;max-width:100%}
.cake .plate{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:110%;height:22px;border-radius:50%;background:#e9e3ff;box-shadow:0 4px 0 #cfc4ef}
.cake .layer{position:absolute;left:50%;transform:translateX(-50%);height:60px;border-radius:14px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.cake .cream{position:absolute;left:-3%;right:-3%;top:-10px;height:22px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.cake .top{position:absolute;transform:translate(-50%,0);font-size:28px;line-height:1;pointer-events:none}
.cake .candle{position:absolute;transform:translateX(-50%);width:10px;height:38px;background:repeating-linear-gradient(135deg,#ff5c7a 0 6px,#fff 6px 12px);border-radius:3px}
.cake .flame{position:absolute;left:50%;top:-16px;width:12px;height:16px;transform:translateX(-50%) scale(0);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff5a0,#ffb347 60%,#ff7a3d);transition:transform .3s}
.cake .flame.on{transform:translateX(-50%) scale(1);animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{from{transform:translateX(-50%) scale(1) rotate(-6deg)}to{transform:translateX(-50%) scale(1.15) rotate(6deg)}}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.ctrl .opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctrl .sw{width:64px;height:64px;border-radius:50%;border:4px solid transparent;box-shadow:0 4px 0 var(--line);font-size:.8rem;color:#3b2a1a}
.ctrl .sw.on{border-color:var(--accent)}
.ctrl .em{width:64px;height:64px;border-radius:16px;background:#fff7e0;font-size:2rem;box-shadow:0 4px 0 var(--line)}
/* juice */
.kitchen{display:flex;gap:30px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.blender{position:relative;width:150px;display:flex;flex-direction:column;align-items:center}
.blender .lid{width:100px;height:18px;background:#8a6f52;border-radius:10px 10px 0 0}
.blender .jar{position:relative;width:120px;height:170px;background:rgba(200,230,255,.45);border:4px solid #a9c9e8;border-top:0;border-radius:0 0 22px 22px;overflow:hidden}
.blender .liquid{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .4s,background .4s}
.blender .bits span{position:absolute;font-size:30px;transition:transform .18s}
.blender .base{width:140px;height:50px;background:#ff7a3d;border-radius:12px;margin-top:-4px;display:grid;place-items:center;box-shadow:0 5px 0 #c9541e}
.blender .base .btn{width:22px;height:22px;border-radius:50%;background:#fff}
.blender.whirr{animation:whirr .12s linear infinite}
@keyframes whirr{0%{transform:translate(-2px,0) rotate(-1deg)}50%{transform:translate(2px,-1px) rotate(1deg)}100%{transform:translate(-2px,0) rotate(-1deg)}}
.glass{position:relative;width:90px;height:140px;border:4px solid #a9c9e8;border-top:0;border-radius:0 0 16px 16px;background:rgba(200,230,255,.3);overflow:visible}
.glass .gl-liquid{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1.2s ease-out;border-radius:0 0 12px 12px}
.glass .straw{position:absolute;right:14px;top:-30px;width:10px;height:120px;background:repeating-linear-gradient(0deg,#ff5c7a 0 10px,#fff 10px 20px);border-radius:5px;transform:rotate(12deg)}
@media (prefers-reduced-motion:reduce){.blender.whirr,.cake .flame.on{animation:none}}


/* paint */
canvas#paint{width:100%;max-width:720px;height:auto;aspect-ratio:3/2;background:#fff;border-radius:18px;border:6px solid #f3e5c8;touch-action:none;display:block}
.paintbar{display:flex;flex-direction:column;gap:8px;width:100%;max-width:720px}
.paintbar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paintbar .lbl{font-size:1rem;color:var(--muted)}
.paintbar .tool{min-width:64px;height:60px;border-radius:14px;background:#fff7e0;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid transparent}
.paintbar .tool span{font-size:1.5rem;line-height:1}.paintbar .tool small{font-size:.75rem;color:var(--muted)}
.paintbar .tool.on{border-color:var(--accent2);background:#fff}
.paintbar .sw{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.paintbar .sw.on{box-shadow:0 0 0 4px var(--accent2)}
.paintbar .sizes{display:flex;gap:6px}
.paintbar .sizes button{width:52px;height:52px;border-radius:12px;background:#fff7e0;display:grid;place-items:center;border:3px solid transparent}
.paintbar .sizes button.on{border-color:var(--accent2);background:#fff}
.paintbar .sizes i{display:block;border-radius:50%}
/* cookie */
.cookie{width:min(300px,80vw);aspect-ratio:1;max-width:100%}
.cookie svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
.cookie.baking{animation:bake 2.5s ease-in-out}
@keyframes bake{0%{filter:brightness(1)}50%{filter:brightness(1.15) sepia(.3)}100%{filter:brightness(1)}}
.ctrl .em.on{border:4px solid var(--accent);background:#fff}
@media (prefers-reduced-motion:reduce){.cookie.baking{animation:none}}

/* phonics */
.letter{font-family:var(--en);font-size:clamp(4rem,18vw,7rem);font-weight:700;color:var(--accent);line-height:1}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.choices button{background:#fff7e0;border-radius:22px;padding:16px;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 5px 0 var(--line);border:4px solid transparent}
.choices button .em{font-size:3rem;line-height:1}
.choices button .w{font-family:var(--en);font-weight:700}
.choices button.ok{border-color:var(--good);background:#e6f8ec}
.choices button.no{border-color:var(--bad);background:#ffe9ee}
.spk{background:var(--card);border-radius:999px;padding:10px 20px;font-size:1.2rem;box-shadow:0 4px 0 var(--line)}

/* reward + video frame */
.reward{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:10px;width:100%}
.reward .mon{width:120px;height:120px}.reward .mon svg{width:100%;height:100%}
.frame{width:100%;max-width:720px;background:linear-gradient(135deg,#ffb347,#ff7a3d 40%,#ff5c7a);padding:14px;border-radius:30px;box-shadow:0 8px 0 #b8324d;position:relative}
.frame::before{content:"★ ★ ★";position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--star);color:#fff;padding:2px 16px;border-radius:999px;font-family:var(--en);font-size:1rem;letter-spacing:.2em}
.frame .inner{background:#1d1733;border-radius:18px;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;overflow:hidden;position:relative;color:#fff}
.frame video{width:100%;height:100%;object-fit:contain;display:block}
.frame .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(29,23,51,.55)}
.frame .play button{width:110px;height:110px;border-radius:50%;background:var(--star);font-size:3rem;box-shadow:0 6px 0 #c99a1c}
.frame .empty{padding:20px;font-size:1.2rem;line-height:1.5}
.parent{color:var(--muted);font-size:1rem;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-width:720px}
.parent details{width:100%;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.parent summary{cursor:pointer}
.parent .gate{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.parent input{font:inherit;font-size:1rem;padding:8px 12px;border-radius:12px;border:2px solid var(--line);max-width:100%}
.parent .st{font-size:.95rem}

/* video time */
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytshield{position:absolute;top:0;left:0;right:0;height:60px}
.timer{font-family:var(--en);font-size:1.5rem;background:var(--card);padding:6px 20px;border-radius:999px;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.rowbtn{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;border-radius:3px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti i{animation:none;display:none}}
</style>
</head>
<body>
<div id="app" class="screen"></div>
<div class="confetti" id="confetti"></div>

<script src="videos.js"></script>

let AC=null;
function ac(){ try{ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()} if(AC.state!=='running')AC.resume(); return AC }catch(e){return null} }
function tone(freq,dur=.12,type='sine',vol=.25,when=0){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,a.currentTime+when);g.gain.linearRampToValueAtTime(vol,a.currentTime+when+.01);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.05) }

  no:()=>tone(200,.25,'sawtooth',.12),
  jump:()=>{tone(400,.08,'square',.12);tone(700,.1,'square',.12,.06)},
  star:()=>{tone(1047,.1,'sine',.2);tone(1319,.16,'sine',.2,.08)},
  fall:()=>{tone(300,.2,'triangle',.2);tone(180,.3,'triangle',.2,.15)},

const AUD=new Audio(); AUD.preload='auto'; AUD.setAttribute('playsinline',''); let audioOK=false, speaking=null;
/* mobile: the clips are decoded once into Web Audio buffers and played with their volume normalized (phone speakers are quiet,
   and the clips were recorded at different levels). A looping silent <audio> keeps iOS in "playback" mode so Web Audio is heard
   even with the ring/silent switch on. The plain <audio> path below stays as the fallback. */
const KEEP=new Audio(SILENT); KEEP.loop=true; KEEP.setAttribute('playsinline','');
const BUF={}; let decoding=false, curSrc=null;
async function decodeClips(){ const a=ac(); if(!a||decoding)return; decoding=true;
  for(const k of Object.keys(CLIPS)){ if(BUF[k])continue;
    try{ const bin=atob(CLIPS[k].split(',')[1]); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const buf=await new Promise((res,rej)=>{ const pr=a.decodeAudioData(u8.buffer,res,rej); if(pr&&pr.then)pr.then(res,rej) });
      let peak=0; for(let c=0;c<buf.numberOfChannels;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i++){ const v=d[i]<0?-d[i]:d[i]; if(v>peak)peak=v } }
      BUF[k]={buf,gain:Math.min(4,.95/Math.max(peak,.05))} }catch(e){} }
  decoding=false; }
function stopClip(){ try{ if(curSrc){ curSrc.onended=null; curSrc.stop() } }catch(e){} curSrc=null; try{AUD.pause()}catch(e){} }
function keepAlive(){ try{ if(KEEP.paused){ const p=KEEP.play(); if(p&&p.catch)p.catch(()=>{}) } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ try{KEEP.pause()}catch(e){} } });
function unlockAudio(){ ac(); decodeClips(); keepAlive(); if(audioOK||unlockAudio.trying)return; unlockAudio.trying=true; try{ AUD.src=SILENT; AUD.volume=1; AUD.play().then(()=>{audioOK=true}).catch(()=>{}).finally(()=>{unlockAudio.trying=false}) }catch(e){unlockAudio.trying=false} }
document.addEventListener('pointerdown',unlockAudio,{capture:true}); document.addEventListener('touchend',unlockAudio,{capture:true,passive:true}); document.addEventListener('keydown',unlockAudio,{capture:true});
function keysFor(t){ // map a spoken sentence to clip keys
  t=t.trim(); let m;
  if((m=t.match(/^Which one starts with "?([A-Z])"?\??$/)))return ['q_starts','L_'+m[1]];
  if((m=t.match(/^Listen\.? ([a-z-]+)\. \1\.$/)))return ['q_listen','W_'+m[1],'W_'+m[1]];
  if((m=t.match(/^What letter does it start with\? ([a-z-]+)\.$/)))return ['q_letter','W_'+m[1]];
  if((m=t.match(/^Which letter is missing\? ([a-z-]+)\.$/)))return ['q_missing','W_'+m[1]];
  if(/^Happy birthday to you!?$/i.test(t))return ['happy_birthday']; if(/^Yummy cookie!?$/i.test(t))return ['yummy_cookie'];
  if((m=t.match(/^([A-Z])\.?$/)))return ['L_'+m[1]];
  if((m=t.match(/^([a-z][a-z -]*)\.?$/)))return ['W_'+m[1].replace(/ /g,'_')];
  return null;
}
function speakFallback(t){ try{ if(!window.speechSynthesis)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85; setTimeout(()=>speechSynthesis.speak(u),120) }catch(e){} }
function playClip(key){ const a=AC, b=BUF[key];
  if(b&&a&&a.state==='running'){ try{ return new Promise(res=>{ let done=false; const fin=()=>{ if(done)return; done=true; if(curSrc===src)curSrc=null; res(true) };
      const src=a.createBufferSource(); src.buffer=b.buf; const g=a.createGain(); g.gain.value=b.gain; src.connect(g).connect(a.destination);
      src.onended=fin; curSrc=src; src.start(); setTimeout(fin,b.buf.duration*1000+250) }) }catch(e){} }
  return new Promise(res=>{ let done=false; const fin=ok=>{ if(done)return; done=true; AUD.onended=AUD.onerror=null; res(ok) };
  AUD.onended=()=>fin(true); AUD.onerror=()=>fin(false); AUD.src=CLIPS[key]; AUD.currentTime=0;
  const p=AUD.play(); if(p&&p.catch)p.catch(()=>fin(false)); setTimeout(()=>fin(true),6000); }) }
function speak(t){ const keys=keysFor(t);
  if(!keys||!keys.every(k=>CLIPS[k])){ speakFallback(t); return }
  const my=speaking={}; stopClip();
  (async()=>{ for(let i=0;i<keys.length;i++){ if(speaking!==my)return; const ok=await playClip(keys[i]); if(!ok){ if(speaking===my)speakFallback(t); return } if(speaking!==my)return; await new Promise(r=>setTimeout(r,140)); } })();
}
function speechStatus(){ return '' }
function celebrate(n=40){ const c=document.getElementById('confetti'); const cols=['#ff7a3d','#4fb3ff','#4cc26e','#ffc93c','#ff5c7a'];
  for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.background=cols[i%5];e.style.animationDelay=(Math.random()*.6)+'s';c.appendChild(e);setTimeout(()=>e.remove(),3000)} }
function newQuest(){ S.quests++; S.stars=0; S.stickerDone=false; S.cakeDone=false; S.juiceDone=false; S.drawDone=false; S.cookieDone=false; save() }

    <button class="big" id="goBtn">이름 정하기!</button></div>
    <div class="msg" id="nmsg"></div></div>`;
  let chosen = typeof pick==='object' ? 'custom' : pick;
  app.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{SFX.pick(); chosen=b.dataset.k;
    if(chosen==='custom'&&!S.custom){go(screenMaker);return}
    app.querySelectorAll('.pick button').forEach(x=>x.classList.toggle('on',x===b))});
  app.querySelector('#mk').onclick=()=>go(screenMaker);
  const inp=app.querySelector('#nameIn');
  let composing=false; inp.addEventListener('compositionstart',()=>composing=true); inp.addEventListener('compositionend',()=>composing=false);

/* ---------- puzzle: 3x3 tap-to-swap, sound on every tap ---------- */
function screenPuzzle(){
  const n=3,total=9; let order=[...Array(total).keys()];
  do{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]} }while(order.every((v,i)=>v===i));
  let sel=-1, solved=false;
  app.innerHTML=topBar()+`<div class="stage"><div class="bar"><button class="ghost" id="back">← 돌아가기</button><h2>🧩 그림 퍼즐</h2></div>
    <div class="msg">조각 두 개를 차례로 눌러서 바꿔요!</div><div class="pz" id="pz"></div><div class="msg" id="pmsg"></div></div>`;
  app.querySelector('#back').onclick=()=>go(screenMenu);
  const grid=app.querySelector('#pz'), uri=monURI();
  function render(){
    grid.innerHTML='';
    order.forEach((piece,pos)=>{
      const b=document.createElement('button'); const r=Math.floor(piece/n), c=piece%n;
      b.style.backgroundImage=`url("${uri}")`; b.style.backgroundPosition=`${c*50}% ${r*50}%`; b.setAttribute('aria-label',`조각 ${pos+1}`);
      if(pos===sel)b.classList.add('sel'); if(solved)b.classList.add('done');
      b.onclick=()=>{ if(solved)return;
        if(sel<0){sel=pos;SFX.pick()} else if(sel===pos){sel=-1;SFX.tap()} else {[order[sel],order[pos]]=[order[pos],order[sel]];sel=-1;SFX.swap();check()}
        render(); };
      grid.appendChild(b);
    });
  }
  function check(){ if(order.every((v,i)=>v===i)){ solved=true; addStars(3); SFX.win(); celebrate();
      app.querySelector('#pmsg').innerHTML=`완성! ⭐⭐⭐ <br><button class="big green" id="again">한 번 더</button> <button class="big" id="home">돌아가기</button>`;
      setTimeout(()=>{app.querySelector('#again').onclick=()=>go(screenPuzzle);app.querySelector('#home').onclick=()=>go(screenMenu)},0); } }
  render();
}

/* ---------- town runner: tap to jump, don't fall ---------- */
function screenRunner(){
  const W=720,H=360, GROUND=300;
  app.innerHTML=topBar()+`<div class="stage"><div class="bar"><button class="ghost" id="back">← 돌아가기</button><h2>🏘️ 마을 달리기</h2></div>
    <div class="msg" id="rmsg">화면을 톡! 누르면 점프해요. 구멍에 빠지지 않게 깃발까지 가요!</div>
    <canvas id="run" width="${W}" height="${H}"></canvas>
    <div class="runhint"><span id="rstar">⭐ 0 / 5</span><button class="big blue" id="jumpBtn">⬆ 점프!</button></div></div>`;
  app.querySelector('#back').onclick=()=>go(screenMenu);
  const cv=app.querySelector('#run'), ctx=cv.getContext('2d');
  const img=new Image(); img.src=monURI();
  // level: ground segments [x, width]; gaps between them are the holes
  const segs=[]; let x=0; const LEN=20;
  for(let i=0;i<LEN;i++){ const w= i===0?700: 260+Math.random()*220; segs.push([x,w]); x+=w+(i===LEN-1?0:(80+Math.random()*40)); }
  const END=x+300; segs.push([x,400]);
  const stars=[]; for(let i=1;i<=5;i++){ const s=segs[Math.floor(i*segs.length/6)]; stars.push({x:s[0]+s[1]/2,y:GROUND-110-(i%2)*30,got:false}); }
  const deco=[]; segs.forEach((s,i)=>{ if(i===0||i===segs.length-1)return; let d=s[0]+40; while(d<s[0]+s[1]-60){ deco.push({x:d,t:Math.random()<.5?'house':'tree',c:Math.floor(Math.random()*5),h:60+Math.random()*40}); d+=120+Math.random()*80; } });
  const flowers=[]; segs.forEach(s=>{ for(let f=s[0]+20;f<s[0]+s[1]-20;f+=55+Math.random()*40)flowers.push({x:f,c:Math.floor(Math.random()*4)}) });
  const clouds=[...Array(14)].map((_,i)=>({x:i*520+Math.random()*300,y:30+Math.random()*80,w:70+Math.random()*60}));
  let pl={x:120,y:GROUND-48,vy:0,on:true,coyote:0,buf:0}, cam=0, speed=3.2, got=0, done=false, dead=0, checkpoint=0, t=0, raf;
  const groundAt=(px)=>segs.some(s=>px>=s[0]&&px<=s[0]+s[1]);
  function jump(){ if(done)return; SFX.tap(); pl.buf=8; }
  const onDown=e=>{e.preventDefault();jump()};
  cv.addEventListener('pointerdown',onDown); app.querySelector('#jumpBtn').addEventListener('pointerdown',onDown);
  const onKey=e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}}; window.addEventListener('keydown',onKey);
  function reset(){ pl.x=checkpoint+120; pl.y=GROUND-48; pl.vy=0; dead=0; }
  function update(){
    t++; if(dead){ dead--; if(dead===0)reset(); return } if(done)return;
    pl.x+=speed; if(pl.buf>0)pl.buf--;
    const feetOn = groundAt(pl.x+8)||groundAt(pl.x+40);
    if(pl.on&&feetOn)pl.coyote=10; else if(pl.coyote>0)pl.coyote--;
    if(pl.buf>0&&(pl.on&&feetOn||pl.coyote>0)){ pl.vy=-13.5; pl.on=false; pl.coyote=0; pl.buf=0; SFX.jump(); }
    pl.vy+=.6; pl.y+=pl.vy;
    if(pl.y>=GROUND-48&&feetOn&&pl.vy>=0){ pl.y=GROUND-48; pl.vy=0; pl.on=true; } else pl.on=false;
    // checkpoint every segment start we pass
    segs.forEach((s,i)=>{ if(i>0&&pl.x>s[0]+20&&checkpoint<s[0]&&i%3===0)checkpoint=s[0] });
    stars.forEach(s=>{ if(!s.got&&Math.abs(pl.x+24-s.x)<28&&Math.abs(pl.y+24-s.y)<36){s.got=true;got++;SFX.star();app.querySelector('#rstar').textContent=`⭐ ${got} / 5`} });
    if(pl.y>H+20){ dead=45; SFX.fall(); app.querySelector('#rmsg').textContent='앗, 구멍에 빠졌어요! 다시 가 보자 💪'; }
    if(pl.x>END-60){ done=true; addStars(3); SFX.win(); celebrate();
      app.querySelector('#rmsg').innerHTML=`깃발 도착! ⭐⭐⭐ ${got===5?'별도 다 모았어요! 최고!':''}<br><button class="big green" id="again">한 번 더</button> <button class="big" id="home">돌아가기</button>`;
      app.querySelector('#again').onclick=()=>go(screenRunner); app.querySelector('#home').onclick=()=>go(screenMenu); }
    cam=pl.x-150;
  }
  function roundRect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function draw(){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#bfe9ff'); g.addColorStop(1,'#fff7e0'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; clouds.forEach(c=>{const cx=((c.x-cam*.3)%(W+400)+W+400)%(W+400)-200; ctx.beginPath();ctx.ellipse(cx,c.y,c.w*.6,22,0,0,7);ctx.ellipse(cx-c.w*.3,c.y+8,c.w*.4,18,0,0,7);ctx.ellipse(cx+c.w*.3,c.y+8,c.w*.4,18,0,0,7);ctx.fill()});
    ctx.fillStyle='#cfeec2'; for(let i=-1;i<4;i++){const hx=((i*420-cam*.5)%1680+1680)%1680-420; ctx.beginPath();ctx.ellipse(hx,GROUND+30,260,110,0,0,7);ctx.fill()}
    const hc=['#ffb3c6','#ffd97a','#b4e88a','#a8d8ff','#d9b8ff'];
    deco.forEach(d=>{ const dx=d.x-cam; if(dx<-120||dx>W+40)return;
      if(d.t==='house'){ roundRect(dx,GROUND-d.h,90,d.h,8,hc[d.c]); ctx.fillStyle='#e8553a'; ctx.beginPath();ctx.moveTo(dx-10,GROUND-d.h);ctx.lineTo(dx+45,GROUND-d.h-40);ctx.lineTo(dx+100,GROUND-d.h);ctx.fill();
        roundRect(dx+36,GROUND-34,20,34,6,'#8a5a3b'); roundRect(dx+10,GROUND-d.h+14,20,18,4,'#fff'); roundRect(dx+60,GROUND-d.h+14,20,18,4,'#fff'); }
      else { roundRect(dx+16,GROUND-40,14,40,4,'#a06a3f'); ctx.fillStyle=['#5fcc7a','#4cb86a','#7fd68f','#3fa85e','#8fe09a'][d.c]; ctx.beginPath();ctx.arc(dx+23,GROUND-50,26,0,7);ctx.arc(dx+5,GROUND-38,18,0,7);ctx.arc(dx+41,GROUND-38,18,0,7);ctx.fill();
        ctx.fillStyle='#ff5c7a'; ctx.beginPath();ctx.arc(dx+15,GROUND-56,4,0,7);ctx.arc(dx+32,GROUND-46,4,0,7);ctx.fill(); } });
    segs.forEach(s=>{ const sx=s[0]-cam; if(sx>W||sx+s[1]<0)return; ctx.fillStyle='#c48a55'; ctx.fillRect(sx,GROUND,s[1],H-GROUND); ctx.fillStyle='#6fcf70'; ctx.fillRect(sx,GROUND-4,s[1],16); ctx.fillStyle='#8ee28a'; ctx.fillRect(sx,GROUND-4,s[1],6); });
    const fc=['#ff5c7a','#ffc93c','#ff7a3d','#c9a8ff']; flowers.forEach(f=>{const fx=f.x-cam; if(fx<0||fx>W)return; ctx.fillStyle=fc[f.c]; ctx.beginPath();ctx.arc(fx,GROUND-10,5,0,7);ctx.fill(); ctx.fillStyle='#4cc26e';ctx.fillRect(fx-1,GROUND-8,2,8)});
    stars.forEach(s=>{ if(s.got)return; const sx=s.x-cam; if(sx<-30||sx>W+30)return; const by=s.y+Math.sin(t/10)*4; ctx.fillStyle='#ffc93c'; ctx.beginPath(); for(let i=0;i<10;i++){const r=i%2?8:18,a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(sx+Math.cos(a)*r,by+Math.sin(a)*r)} ctx.fill(); });
    const fx=END-cam-80; ctx.fillStyle='#8a5a3b'; ctx.fillRect(fx,GROUND-120,6,120); ctx.fillStyle='#ff5c7a'; ctx.beginPath();ctx.moveTo(fx+6,GROUND-120);ctx.lineTo(fx+60,GROUND-100);ctx.lineTo(fx+6,GROUND-80);ctx.fill();
    if(!dead){ const bob=pl.on?Math.abs(Math.sin(t/5))*3:0; if(img.complete&&img.naturalWidth)ctx.drawImage(img,pl.x-cam,pl.y-bob,48,48); }
  }
  function loop(){ update(); draw(); raf=requestAnimationFrame(loop) }
  raf=requestAnimationFrame(loop);
  stopGame=()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',onKey)};
}

      app.querySelector('#again').onclick=()=>app.querySelector('#make').click(); },14000);
  };

    cakeEl.innerHTML=`<div class="plate"></div>${h}`;
  }

    drawCake(); msg.textContent=st.done?'🎉 생일 축하합니다!':STEPS[st.step]; ctrl.innerHTML='';
    const row=document.createElement('div'); row.className='opts';
    if(st.step===0){ BASES.forEach((b,i)=>{const x=document.createElement('button');x.className='sw'+(st.base===i?' on':'');x.style.background=b[0];x.innerHTML=`<small>${b[1]}</small>`;x.onclick=()=>{st.base=i;SFX.tap();render()};row.appendChild(x)});
      const l=document.createElement('button');l.className='big';l.textContent=st.layers<3?'층 더 쌓기 ⬆':'층 줄이기 ⬇';l.onclick=()=>{st.layers=st.layers<3?st.layers+1:1;SFX.swap();render()};ctrl.appendChild(row);ctrl.appendChild(l); }
    else if(st.step===1){ CREAMS.forEach((c,i)=>{const x=document.createElement('button');x.className='sw'+(st.cream===i?' on':'');x.style.background=c;x.onclick=()=>{st.cream=i;SFX.tap();render()};row.appendChild(x)}); ctrl.appendChild(row); }
    else if(st.step===2){ TOPS.forEach(e=>{const x=document.createElement('button');x.className='em';x.textContent=e;x.onclick=()=>{ if(st.tops.length>=14){SFX.no();return} st.tops.push({e,x:18+Math.random()*64,y:14+Math.random()*(st.layers*62-10)});SFX.pick();render()};row.appendChild(x)});
      const u=document.createElement('button');u.className='ghost';u.textContent='하나 빼기';u.onclick=()=>{st.tops.pop();SFX.swap();render()}; ctrl.appendChild(row);ctrl.appendChild(u); }
    else if(st.step===3&&!st.done){ const c=document.createElement('button');c.className='big';c.textContent=`🕯️ 초 꽂기 (${st.candles})`;c.onclick=()=>{st.candles=Math.min(7,st.candles+1);SFX.tap();render()};
      const f=document.createElement('button');f.className='big pink';f.textContent='🔥 불 붙이기';f.hidden=st.candles===0||st.lit;f.onclick=()=>{st.lit=true;SFX.ok();render()};
      const b=document.createElement('button');b.className='big blue';b.textContent='💨 후~ 불기!';b.hidden=!st.lit;b.onclick=()=>{st.lit=false;st.done=true;SFX.win();celebrate(60);speak('Happy birthday to you!');if(!S.cakeDone){S.cakeDone=true;addStars(2)}render()};
      ctrl.append(c,f,b); }
    const nav=document.createElement('div'); nav.className='opts';
    if(st.step>0&&!st.done){const p=document.createElement('button');p.className='ghost';p.textContent='← 이전';p.onclick=()=>{st.step--;SFX.tap();render()};nav.appendChild(p)}
    if(st.step<3){const n=document.createElement('button');n.className='big green';n.textContent='다음 →';n.onclick=()=>{st.step++;SFX.pick();render()};nav.appendChild(n)}
    if(st.done){const n=document.createElement('button');n.className='big green';n.textContent='새 케이크';n.onclick=()=>go(screenCake);const h=document.createElement('button');h.className='big';h.textContent='돌아가기';h.onclick=()=>go(screenMenu);nav.append(n,h)}

/* ---------- juice maker: drop ingredients in the blender, blend, pour ---------- */
const INGR=[
  {e:'🍓',n:'딸기',en:'strawberry',c:'#ff4d6d'},{e:'🍌',n:'바나나',en:'banana',c:'#ffe66d'},{e:'🍎',n:'사과',en:'apple',c:'#ff8c8c'},{e:'🍊',n:'오렌지',en:'orange',c:'#ff9f1c'},
  {e:'🍇',n:'포도',en:'grape',c:'#9b5de5'},{e:'🥝',n:'키위',en:'kiwi',c:'#8ac926'},{e:'🍉',n:'수박',en:'watermelon',c:'#ff5c7a'},{e:'🫐',n:'블루베리',en:'blueberry',c:'#4361ee'},
  {e:'🥕',n:'당근',en:'carrot',c:'#ff7a3d'},{e:'🥛',n:'우유',en:'milk',c:'#fdfdfd'},{e:'🧃',n:'사과주스',en:'juice',c:'#ffd97a'},{e:'🥤',n:'콜라',en:'cola',c:'#5a3a2a'},
  {e:'🍯',n:'꿀',en:'honey',c:'#f4a300'},{e:'🧊',n:'얼음',en:'ice',c:'#bfe9ff'},{e:'🍫',n:'초콜릿',en:'chocolate',c:'#6b3e26'},{e:'🥒',n:'오이',en:'cucumber',c:'#4cc26e'},{e:'🧅',n:'양파',en:'onion',c:'#e8d8ff'}
];
function screenJuice(){
  let cup=[], phase='fill';   // fill → blend → pour → done
  app.innerHTML=topBar()+`<div class="stage"><div class="bar"><button class="ghost" id="back">← 돌아가기</button><h2>🧃 주스 만들기</h2></div>
    <div class="msg" id="jmsg">재료를 눌러서 믹서기에 넣어요! (최대 6개)</div>
    <div class="kitchen"><div class="blender" id="bl"><div class="lid"></div><div class="jar"><div class="liquid" id="liq"></div><div class="bits" id="bits"></div></div><div class="base"><span class="btn"></span></div></div>
      <div class="glass" id="glass"><div class="gl-liquid" id="gliq"></div><span class="straw"></span></div></div>
    <div class="tray" id="tray"></div>
    <div class="namebox"><button class="big pink" id="blend">🌀 갈기!</button><button class="ghost" id="undo">하나 빼기</button><button class="ghost" id="reset">비우기</button></div></div>`;
  app.querySelector('#back').onclick=()=>go(screenMenu);
  const tray=app.querySelector('#tray'), bits=app.querySelector('#bits'), liq=app.querySelector('#liq'), gliq=app.querySelector('#gliq'), msg=app.querySelector('#jmsg'), bl=app.querySelector('#bl');
  INGR.forEach(it=>{const b=document.createElement('button');b.innerHTML=`<span class="em">${it.e}</span><small>${it.n}</small>`;b.onclick=()=>{ if(phase!=='fill')return; if(cup.length>=6){SFX.no();msg.textContent='믹서기가 꽉 찼어요! 이제 갈아 봐요.';return} cup.push(it);SFX.pick();speak(it.en);render()};tray.appendChild(b)});
  function mix(){ if(!cup.length)return '#eee'; const rgb=cup.map(i=>i.c.match(/\w\w/g).map(h=>parseInt(h,16))); const avg=[0,1,2].map(k=>Math.round(rgb.reduce((a,r)=>a+r[k],0)/rgb.length)); return `rgb(${avg.join(',')})` }
  function render(){ bits.innerHTML=cup.map((i,k)=>`<span style="left:${12+(k%3)*30}%;bottom:${6+Math.floor(k/3)*34}%">${i.e}</span>`).join(''); liq.style.height=(cup.length*13)+'%'; liq.style.background=mix(); app.querySelector('#blend').disabled=cup.length===0; }
  app.querySelector('#undo').onclick=()=>{ if(phase!=='fill')return; cup.pop();SFX.swap();render() };
  app.querySelector('#reset').onclick=()=>{ if(phase!=='fill')return; cup=[];SFX.no();render() };
  function verdict(){ const names=cup.map(i=>i.n); const weird=cup.filter(i=>['양파','오이','콜라','초콜릿'].includes(i.n)).length; const fruit=cup.filter(i=>!['우유','사과주스','콜라','꿀','얼음','초콜릿','양파','오이'].includes(i.n)).length;
    const title=[...new Set(names)].slice(0,3).join(' ')+' 주스'; let react;
    if(weird>=2) react='으엑! 😖 이상한 맛이에요… 다시 만들어 볼까요?'; else if(weird===1&&fruit===0) react='음… 🤔 조금 이상한 맛! 과일을 넣어 봐요.'; else if(cup.some(i=>i.n==='꿀')||cup.some(i=>i.n==='우유')) react='부드럽고 달콤해요! 😋 Yummy!'; else react='상큼하고 맛있어요! 😄 Delicious!';
    return {title,react,ok:weird<2} }
  app.querySelector('#blend').onclick=()=>{ if(phase!=='fill'||!cup.length)return; phase='blend'; SFX.swap(); bl.classList.add('whirr'); msg.textContent='위이잉~ 갈고 있어요!';
    const a=ac(); let noise=null; try{ if(a){ const buf=a.createBuffer(1,a.sampleRate*3,a.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.25; noise=a.createBufferSource(); noise.buffer=buf; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; const g=a.createGain(); g.gain.value=.4; noise.connect(f).connect(g).connect(a.destination); noise.start(); } }catch(e){}
    let n=0; const sh=setInterval(()=>{ bits.querySelectorAll('span').forEach(s=>{s.style.transform=`translate(${(Math.random()-.5)*40}px,${(Math.random()-.5)*60}px) rotate(${Math.random()*360}deg)`}); if(++n>14){clearInterval(sh)} },180);
    setTimeout(()=>{ try{noise&&noise.stop()}catch(e){} bl.classList.remove('whirr'); bits.innerHTML=''; liq.style.height='80%'; phase='pour'; msg.innerHTML='다 갈렸어요! <button class="big blue" id="pour">🥤 컵에 따르기</button>';
      app.querySelector('#pour').onclick=()=>{ phase='done'; SFX.ok(); liq.style.height='0%'; gliq.style.background=mix(); gliq.style.height='85%'; const v=verdict();
        setTimeout(()=>{ msg.innerHTML=`<b>${esc(v.title)}</b> 완성! ${v.react}<br><button class="big green" id="again">또 만들기</button> <button class="big" id="home">돌아가기</button>`;
          if(v.ok){ SFX.win(); celebrate(40); if(!S.juiceDone){S.juiceDone=true;addStars(2)} } else SFX.no();
          app.querySelector('#again').onclick=()=>go(screenJuice); app.querySelector('#home').onclick=()=>go(screenMenu); },1300); }; },3000);
  };
  render();
}


/* ---------- drawing board ---------- */
function screenDraw(){
  const COLORS=['#3b2a1a','#ff5c7a','#ff7a3d','#ffc93c','#4cc26e','#4fb3ff','#8b5cf6','#ff9ad5','#8a5a3b','#ffffff'];
  const BRUSH=[{k:'pen',l:'연필',e:'✏️'},{k:'marker',l:'마커',e:'🖍️'},{k:'spray',l:'스프레이',e:'💨'},{k:'stamp',l:'도장',e:'⭐'},{k:'eraser',l:'지우개',e:'🧽'}];
  const STAMPS=['⭐','❤️','🌸','🍓','🐾','🌈'];
  let color=COLORS[1], brush='pen', size=12, stamp=STAMPS[0], strokes=0, history=[];
  app.innerHTML=topBar()+`<div class="stage"><div class="bar"><button class="ghost" id="back">← 돌아가기</button><h2>🎨 그림 그리기</h2></div>
    <div class="paintbar">
      <div class="row" id="brushes"></div>
      <div class="row" id="colors"></div>
      <div class="row"><span class="lbl">굵기</span><div id="sizes" class="sizes"></div><span class="lbl" id="stampLbl" hidden>도장</span><div id="stamps" class="row" hidden></div></div>
    </div>
    <canvas id="paint" width="900" height="600"></canvas>
    <div class="namebox"><button class="ghost" id="undo">↩ 되돌리기</button><button class="ghost" id="clear">🗑 다 지우기</button><button class="big green" id="done">✅ 완성!</button></div></div>`;
  app.querySelector('#back').onclick=()=>go(screenMenu);
  const cv=app.querySelector('#paint'), ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.lineCap='round'; ctx.lineJoin='round';
  const brushes=app.querySelector('#brushes'), colors=app.querySelector('#colors'), sizes=app.querySelector('#sizes'), stamps=app.querySelector('#stamps');
  function tools(){
    brushes.innerHTML=''; BRUSH.forEach(b=>{const x=document.createElement('button');x.className='tool'+(brush===b.k?' on':'');x.innerHTML=`<span>${b.e}</span><small>${b.l}</small>`;x.onclick=()=>{brush=b.k;SFX.tap();tools()};brushes.appendChild(x)});
    colors.innerHTML=''; COLORS.forEach(c=>{const x=document.createElement('button');x.className='sw'+(color===c&&brush!=='eraser'?' on':'');x.style.background=c;x.setAttribute('aria-label',c);x.onclick=()=>{color=c;if(brush==='eraser')brush='pen';SFX.tap();tools()};colors.appendChild(x)});
    sizes.innerHTML=''; [6,12,22,36].forEach(n=>{const x=document.createElement('button');x.className=size===n?'on':'';x.innerHTML=`<i style="width:${n}px;height:${n}px;background:${brush==='eraser'?'#ccc':color}"></i>`;x.onclick=()=>{size=n;SFX.tap();tools()};sizes.appendChild(x)});
    const st=brush==='stamp'; app.querySelector('#stampLbl').hidden=!st; stamps.hidden=!st;
    stamps.innerHTML=''; STAMPS.forEach(e=>{const x=document.createElement('button');x.className='tool'+(stamp===e?' on':'');x.innerHTML=`<span>${e}</span>`;x.onclick=()=>{stamp=e;SFX.tap();tools()};stamps.appendChild(x)});
  }
  tools();
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  let drawing=false,last=null;
  function dot(x,y){
    if(brush==='stamp'){ ctx.font=`${size*3}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(stamp,x,y); return }
    if(brush==='spray'){ ctx.fillStyle=color; for(let i=0;i<size*1.5;i++){const a=Math.random()*6.283,r=Math.random()*size*1.4;ctx.beginPath();ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,1.5,0,7);ctx.fill()} return }
    ctx.strokeStyle=brush==='eraser'?'#fff':color; ctx.globalAlpha=brush==='marker'?.45:1; ctx.lineWidth=brush==='eraser'?size*2:size;
    ctx.beginPath(); ctx.moveTo(last?last[0]:x,last?last[1]:y); ctx.lineTo(x,y); ctx.stroke(); ctx.globalAlpha=1;
  }
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);history.push(ctx.getImageData(0,0,cv.width,cv.height));if(history.length>12)history.shift();drawing=true;last=null;const [x,y]=pos(e);dot(x,y);last=[x,y];strokes++;if(brush==='stamp')SFX.pick();else tone(brush==='eraser'?300:520+COLORS.indexOf(color)*40,.06,'sine',.08)});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=pos(e);if(brush==='stamp'){if(last&&Math.hypot(x-last[0],y-last[1])<size*2.5)return}dot(x,y);last=[x,y]});
  const up=()=>{drawing=false;last=null}; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  app.querySelector('#undo').onclick=()=>{const h=history.pop();if(h){ctx.putImageData(h,0,0);SFX.swap()}else SFX.no()};
  app.querySelector('#clear').onclick=()=>{history.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);SFX.no()};
  app.querySelector('#done').onclick=()=>{ if(strokes<5){SFX.no();app.querySelector('h2').textContent='🎨 조금 더 그려 봐요!';return}
    SFX.win(); celebrate(50); if(!S.drawDone){S.drawDone=true;addStars(2)}
    app.querySelector('.namebox').innerHTML=`<span class="msg">멋진 그림이에요! 🖼️</span><button class="big green" id="again">새 그림</button><button class="big" id="home">돌아가기</button>`;
    app.querySelector('#again').onclick=()=>go(screenDraw); app.querySelector('#home').onclick=()=>go(screenMenu); };
}

/* ---------- cookie maker ---------- */
function screenCookie(){
  const SHAPES=[{k:'round',l:'동그라미'},{k:'heart',l:'하트'},{k:'star',l:'별'},{k:'bear',l:'곰돌이'},{k:'flower',l:'꽃'},{k:'square',l:'네모'}];

  const ICING=[null,'#ffffff','#ff9ad5','#ffd97a','#a8d8ff','#c9a8ff','#8ee28a'];
  const TOPS=['🍫','🍓','🫐','🥜','🍬','⭐','❤️','🌈','🍒','🥥'];

  app.querySelector('#back').onclick=()=>go(screenMenu);

  function shapePath(k){ return {round:'M60 8 A52 52 0 1 1 59.9 8 Z',
    heart:'M60 108 C20 80 8 56 14 36 C20 16 44 12 60 32 C76 12 100 16 106 36 C112 56 100 80 60 108 Z',
    star:'M60 6 L74 42 L112 44 L82 68 L92 106 L60 84 L28 106 L38 68 L8 44 L46 42 Z',
    bear:'M60 112 A44 44 0 1 1 60.1 112 Z M22 34 A14 14 0 1 1 22.1 34 Z M98 34 A14 14 0 1 1 98.1 34 Z',
    flower:'M60 10 A18 18 0 1 1 60.1 10 M96 28 A18 18 0 1 1 96.1 28 M104 72 A18 18 0 1 1 104.1 72 M76 106 A18 18 0 1 1 76.1 106 M36 108 A18 18 0 1 1 36.1 108 M14 70 A18 18 0 1 1 14.1 70 M26 28 A18 18 0 1 1 26.1 28 M60 32 A30 30 0 1 1 60.1 32',
    square:'M16 16 H104 V104 H16 Z'}[k] }
  function drawCookie(){
    const d=DOUGH[st.dough][0], bakedTint=st.baked?'<rect width="120" height="120" fill="#7a4a1a" opacity=".18" clip-path="url(#cp)"/>':'';
    const icing=st.icing?`<g transform="translate(60 60) scale(.82) translate(-60 -60)"><path d="${shapePath(st.shape)}" fill="${st.icing}" fill-rule="evenodd"/></g>`:'';
    const tops=st.tops.map(t=>`<text x="${t.x}" y="${t.y}" font-size="16" text-anchor="middle" dominant-baseline="central">${t.e}</text>`).join('');
    el.innerHTML=`<svg viewBox="0 0 120 120"><defs><clipPath id="cp"><path d="${shapePath(st.shape)}" fill-rule="evenodd"/></clipPath></defs>
      <path d="${shapePath(st.shape)}" fill="${d}" stroke="#a5713f" stroke-width="3" fill-rule="evenodd" stroke-linejoin="round"/>${bakedTint}${icing}${tops}</svg>`;
  }
  function render(){
    drawCookie(); msg.textContent=st.baked?'🍪 맛있는 과자 완성!':STEPS[st.step]; ctrl.innerHTML='';
    let row=document.createElement('div'); row.className='opts';
    if(st.step===0) SHAPES.forEach(sh=>{const b=document.createElement('button');b.className='em'+(st.shape===sh.k?' on':'');b.innerHTML=`<svg viewBox="0 0 120 120" width="40" height="40"><path d="${shapePath(sh.k)}" fill="#e8b86d" fill-rule="evenodd"/></svg>`;b.setAttribute('aria-label',sh.l);b.onclick=()=>{st.shape=sh.k;SFX.tap();render()};row.appendChild(b)});
    else if(st.step===1) DOUGH.forEach((dg,i)=>{const b=document.createElement('button');b.className='sw'+(st.dough===i?' on':'');b.style.background=dg[0];b.innerHTML=`<small>${dg[1]}</small>`;b.onclick=()=>{st.dough=i;SFX.tap();render()};row.appendChild(b)});
    else if(st.step===2) ICING.forEach(c=>{const b=document.createElement('button');b.className='sw'+(st.icing===c?' on':'');b.style.background=c||'#f3e5c8';b.innerHTML=c?'':'<small>없음</small>';b.onclick=()=>{st.icing=c;SFX.tap();render()};row.appendChild(b)});
    else if(st.step===3){ TOPS.forEach(e=>{const b=document.createElement('button');b.className='em';b.textContent=e;b.onclick=()=>{ if(st.tops.length>=12){SFX.no();return}
        // keep toppings inside the cookie: sample a point until it falls in the shape
        const svg=el.querySelector('svg'), path=svg.querySelector('path'); let x=60,y=60; for(let i=0;i<30;i++){const px=18+Math.random()*84,py=18+Math.random()*84;const pt=svg.createSVGPoint();pt.x=px;pt.y=py;if(path.isPointInFill(pt)){x=px;y=py;break}}
        st.tops.push({e,x,y});SFX.pick();render()};row.appendChild(b)});
      const u=document.createElement('button');u.className='ghost';u.textContent='하나 빼기';u.onclick=()=>{st.tops.pop();SFX.swap();render()};ctrl.appendChild(row);ctrl.appendChild(u);row=null }
    else if(st.step===4&&!st.baked){ const b=document.createElement('button');b.className='big pink';b.textContent='🔥 오븐에 넣기';b.onclick=()=>{ b.disabled=true; msg.textContent='굽는 중… 🔥'; el.classList.add('baking'); tone(220,2.2,'sine',.08);
        setTimeout(()=>{el.classList.remove('baking');st.baked=true;SFX.win();celebrate(50);speak('Yummy cookie!');if(!S.cookieDone){S.cookieDone=true;addStars(2)}render()},2500) }; ctrl.appendChild(b); }
    if(row)ctrl.appendChild(row);
    const nav=document.createElement('div'); nav.className='opts';
    if(st.step>0&&!st.baked){const p=document.createElement('button');p.className='ghost';p.textContent='← 이전';p.onclick=()=>{st.step--;SFX.tap();render()};nav.appendChild(p)}
    if(st.step<4){const n=document.createElement('button');n.className='big green';n.textContent='다음 →';n.onclick=()=>{st.step++;SFX.pick();render()};nav.appendChild(n)}
    if(st.baked){const n=document.createElement('button');n.className='big green';n.textContent='새 과자';n.onclick=()=>go(screenCookie);const h=document.createElement('button');h.className='big';h.textContent='돌아가기';h.onclick=()=>go(screenMenu);nav.append(n,h)}
    ctrl.appendChild(nav);
  }
  render();
}

/* ---------- phonics quiz ---------- */
const WORDS=[['A','apple','🍎'],['B','ball','⚽'],['C','cat','🐱'],['D','dog','🐶'],['E','egg','🥚'],['F','fish','🐟'],['G','grapes','🍇'],['H','hat','🎩'],
 ['I','igloo','🧊'],['J','juice','🧃'],['K','kite','🪁'],['L','lion','🦁'],['M','moon','🌙'],['N','nose','👃'],['O','octopus','🐙'],['P','pig','🐷'],
 ['Q','queen','👸'],['R','rabbit','🐰'],['S','sun','☀️'],['T','tiger','🐯'],['U','umbrella','☂️'],['V','violin','🎻'],['W','water','💧'],['X','x-ray','🩻'],['Y','yo-yo','🪀'],['Z','zebra','🦓']];
const CVC=[['cat','🐱'],['dog','🐶'],['sun','☀️'],['hat','🎩'],['pig','🐷'],['bus','🚌'],['cup','☕'],['bed','🛏️'],['fox','🦊'],['hen','🐔'],['jam','🍯'],['web','🕸️'],['box','📦'],['map','🗺️'],['pen','🖊️'],['bag','👜'],['log','🪵'],['net','🥅'],['lip','👄'],['mop','🧹'],['bee','🐝'],['car','🚗'],['egg','🥚'],['owl','🦉'],['key','🔑']];
const CONFUSE={B:'DP',D:'BP',P:'BD',M:'N',N:'M',C:'KG',K:'CG',G:'KC',S:'Z',Z:'S',F:'V',V:'F',E:'I',I:'E',A:'O',O:'A',U:'O',W:'V',J:'G',Q:'O',T:'D',L:'I',R:'W',H:'N',X:'K',Y:'I'};
function pickLetters(ans,n){ const pool=new Set(); (CONFUSE[ans]||'').split('').forEach(c=>pool.add(c)); const all='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.replace(ans,'').split('').sort(()=>Math.random()-.5); for(const c of all){ if(pool.size>=n)break; pool.add(c) } return [...pool].slice(0,n) }
function screenPhonics(){
  const ROUND=10; let q=0, correct=0, starsGot=0;
  // 4 question types, shuffled: first letter (4 pics), listen → pic (no letter shown), pic → letter, missing letter in a short word
  const types=['first','listen','letter','missing','first','listen','letter','missing','listen','missing'].sort(()=>Math.random()-.5);
  const wpool=[...WORDS].sort(()=>Math.random()-.5), cpool=[...CVC].sort(()=>Math.random()-.5);
  app.innerHTML=topBar()+`<div class="stage"><div class="bar"><button class="ghost" id="back">← 돌아가기</button><h2>🔤 영어 소리 퀴즈</h2><span style="font-family:var(--en)" id="pq"></span></div>
    <div class="msg" id="ask"></div><div class="letter" id="let"></div><button class="spk" id="spk">🔊 Listen again</button><small style="color:var(--muted)">${speechStatus()}</small>
    <div class="choices" id="ch"></div><div class="msg" id="fmsg"></div></div>`;
  app.querySelector('#back').onclick=()=>go(screenMenu);
  const $=id=>app.querySelector('#'+id);
  function finish(){ celebrate(); SFX.win(); $('let').textContent='🏆'; $('ask').textContent=`${correct} out of ${ROUND} correct!`; $('ch').innerHTML=''; $('spk').hidden=true;
    $('fmsg').innerHTML=`<button class="big green" id="again">한 번 더</button> <button class="big" id="home">돌아가기</button>`;
    $('again').onclick=()=>go(screenPhonics); $('home').onclick=()=>go(screenMenu); }
  function ask(prompt, letterText, sayFn, options, isRight, showAnswer){
    $('pq').textContent=`${q+1} / ${ROUND}`; $('let').textContent=letterText; $('ask').textContent=prompt; $('fmsg').textContent='';
    $('spk').onclick=()=>{SFX.tap();sayFn()};
    const ch=$('ch'); ch.innerHTML=''; let locked=false;
    options.forEach(o=>{ const b=document.createElement('button'); b.innerHTML=o.html; b.onclick=()=>{ if(locked)return; locked=true; if(o.say)speak(o.say);
        if(isRight(o)){ b.classList.add('ok'); correct++; SFX.ok(); $('fmsg').textContent='Correct! 🎉'; const want=Math.floor(correct/2); if(want>starsGot){addStars(want-starsGot);starsGot=want;celebrate(15)} }
        else { b.classList.add('no'); SFX.no(); [...ch.children].forEach((c,i)=>{ if(isRight(options[i]))c.classList.add('ok') }); $('fmsg').textContent=`Oops! The answer is ${showAnswer} 🤔`; }
        q++; setTimeout(()=>q>=ROUND?finish():next(),1600); };
      ch.appendChild(b) });
    sayFn();
  }
  function next(){
    const t=types[q];
    if(t==='first'){ const ans=wpool[q%wpool.length]; const others=WORDS.filter(w=>w[0]!==ans[0]).sort(()=>Math.random()-.5).slice(0,3);
      const opts=[ans,...others].sort(()=>Math.random()-.5).map(w=>({html:`<span class="em">${w[2]}</span>`,say:w[1],w}));
      ask(`Which one starts with "${ans[0]}"?`, ans[0], ()=>speak(`Which one starts with ${ans[0]}?`), opts, o=>o.w[0]===ans[0], ans[1]); }
    else if(t==='listen'){ const ans=wpool[(q+7)%wpool.length]; const others=WORDS.filter(w=>w[1]!==ans[1]).sort(()=>Math.random()-.5).slice(0,3);
      const opts=[ans,...others].sort(()=>Math.random()-.5).map(w=>({html:`<span class="em">${w[2]}</span>`,say:null,w}));
      ask('Listen! Which one is it?', '👂', ()=>speak(`Listen. ${ans[1]}. ${ans[1]}.`), opts, o=>o.w[1]===ans[1], ans[1]); }
    else if(t==='letter'){ const ans=wpool[(q+13)%wpool.length]; const letters=[ans[0],...pickLetters(ans[0],3)].sort(()=>Math.random()-.5);
      const opts=letters.map(L=>({html:`<span class="w" style="font-size:2.4rem">${L}</span>`,say:L,L}));
      ask('What letter does it start with?', ans[2], ()=>speak(`What letter does it start with? ${ans[1]}.`), opts, o=>o.L===ans[0], ans[0]); }
    else { const [word,emo]=cpool[q%cpool.length]; const idx=Math.floor(Math.random()*word.length); const missing=word[idx].toUpperCase();
      const shown=word.split('').map((c,i)=>i===idx?'_':c.toUpperCase()).join(' '); const letters=[missing,...pickLetters(missing,2)].sort(()=>Math.random()-.5);
      const opts=letters.map(L=>({html:`<span class="w" style="font-size:2.4rem">${L}</span>`,say:L,L}));
      ask(`Which letter is missing? ${emo}`, shown, ()=>speak(`Which letter is missing? ${word}.`), opts, o=>o.L===missing, `${missing} (${word})`); }
  }
  next();
}

/* ---------- reward: video time. Opening the treasure chest with 20 stars starts a 15-minute window. Videos are picked at random from the folder files (videos.js)
   and Super Simple Songs (songs.js, played with the YouTube player) inside the album frame; when the time is up the chest locks until 20 more stars are collected. ---------- */
const VIDEO_MINUTES=15;
function videoPool(){ const list=Array.isArray(window.VIDEO_FILES)?window.VIDEO_FILES:[];
  return list.filter(f=>typeof f==='string'&&/\.(mp4|webm|m4v|mov|ogv)$/i.test(f)).map(f=>({kind:'file',file:f,key:f,title:f.replace(/^.*\//,'').replace(/\.[^.]+$/,'').replace(/[_]+/g,' ')})) }
function songPool(){ const list=Array.isArray(window.SSS_SONGS)?window.SSS_SONGS:[]; return list.filter(x=>x&&/^[\w-]{11}$/.test(x.id)).map(x=>({kind:'yt',id:x.id,key:'yt:'+x.id,title:x.t||'Super Simple Songs'})) }
function videoSrc(file){ return file.split('/').map(encodeURIComponent).join('/') }
function videoTimeLeft(){ return Math.max(0,(+S.videoUntil||0)-Date.now()) }
function videoWindowActive(){ return videoTimeLeft()>0 }
function fmtLeft(ms){ const t=Math.ceil(ms/1000); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}` }
let ytLoad=null; // the YouTube player API, loaded once and only when needed (no internet → local files only)
const FILE_OPEN=location.protocol==='file:', FILE_MSG="틀 안에서 보려면 폴더의 '몬스터놀이터 열기.bat'를 먼저 켜 주세요. 켜져 있으면 이 페이지가 자동으로 넘어가요. 지금은 ▶를 누르면 유튜브 새 창에서 나와요.";
if(FILE_OPEN){ // double-clicked file: if the local server from '몬스터놀이터 열기.bat' is running, hop over to it so YouTube can play inside the frame
  const target='http://localhost:8765/'+(location.pathname.split('/').pop()||'monster%20game.html')+location.hash;
  fetch('http://localhost:8765/videos.js?t='+Date.now(),{mode:'no-cors',cache:'no-store'}).then(()=>location.replace(target)).catch(()=>{});
} // opened by double-click: YouTube refuses to play without a referrer (error 153), so the folder videos only
function loadYT(){ if(FILE_OPEN)return Promise.resolve(false); if(ytLoad)return ytLoad; ytLoad=new Promise(res=>{ if(window.YT&&YT.Player)return res(true);
  const fail=()=>{ ytLoad=null; res(false) }; const t=setTimeout(fail,7000);
  window.onYouTubeIframeAPIReady=()=>{ clearTimeout(t); res(true) };
  const sc=document.createElement('script'); sc.src='https://www.youtube.com/iframe_api'; sc.onerror=()=>{ clearTimeout(t); fail() }; document.head.appendChild(sc); }); return ytLoad }
async function screenReward(){
  const fresh=!videoWindowActive();
  if(fresh){ if(S.stars<QUEST_GOAL){ go(screenMenu); return } S.videoUntil=Date.now()+VIDEO_MINUTES*60000; newQuest(); }
  save();
  app.innerHTML=topBar({clock:true})+`<div class="stage"><div class="reward">
    <div class="mon">${monSVG()}</div>
    <h1>${esc(S.name)}, ${fresh?'퀘스트 성공!':'영상 시간이에요!'}</h1>
    <div class="msg" id="vmsg">${fresh?`별 ${QUEST_GOAL}개를 다 모았어요. 🎬 ${VIDEO_MINUTES}분 동안 영어 영상을 볼 수 있어요!`:''}</div>
    <div class="frame"><div class="inner" id="inner"><div class="empty">영상을 찾는 중…</div></div></div>
    <div class="rowbtn"><button class="big" id="another" hidden>🎲 다른 영상</button><button class="big blue" id="nextQ">놀이터로 돌아가기</button></div>
    <div class="parent"><details><summary>👨‍👩‍👧 부모님 설정</summary>
      <div class="gate" id="gate">잠금 풀기: <span id="gq"></span> = <input id="ga" inputmode="numeric" style="width:70px" aria-label="정답"><button class="ghost" id="gok">확인</button></div>
      <div id="ptools" hidden></div></details></div>
  </div></div>`;
  if(fresh)celebrate(80);
  const inner=app.querySelector('#inner'), vmsg=app.querySelector('#vmsg'), nextQ=app.querySelector('#nextQ'), another=app.querySelector('#another');
  let player=null, vEl=null, fails=0, ytOK=false, ended=false;
  function stopPlayback(){ try{ if(player&&player.destroy)player.destroy() }catch(e){} player=null; try{ if(vEl){ vEl.pause(); vEl.removeAttribute('src'); vEl.load() } }catch(e){} vEl=null; }
  const tick=setInterval(()=>{ if(videoTimeLeft()<=0)timeUp() },500);
  stopGame=()=>{ clearInterval(tick); stopPlayback() };
  nextQ.onclick=()=>go(screenMenu);
  another.onclick=()=>{ SFX.pick(); showPick(true) };
  function timeUp(){ if(ended)return; ended=true; clearInterval(tick); stopPlayback(); SFX.win(); celebrate(40);
    inner.innerHTML=`<div class="empty">⏰ ${VIDEO_MINUTES}분 영상 시간이 끝났어요!<br><small>별 ${QUEST_GOAL}개를 다시 모으면 보물 상자가 또 열려요.</small></div>`;
    vmsg.textContent='다음 퀘스트도 화이팅 💪'; another.hidden=true; }
  function pickOne(){ const all=[...videoPool(),...((ytOK||FILE_OPEN)?songPool():[])]; if(!all.length)return null;
    let c=all; if(all.length>1&&S.lastVideo){ const f=all.filter(v=>v.key!==S.lastVideo); if(f.length)c=f } return c[Math.floor(Math.random()*c.length)] }
  function playOverlay(auto){ return auto?'':`<div class="play" id="playO"><button id="playB" aria-label="재생">▶</button></div>` }
  function onFail(){ fails++; if(fails>=4){ inner.innerHTML=`<div class="empty">영상을 열 수 없어요.<br><small>인터넷 연결과 폴더의 영상 파일을 확인해 주세요.</small></div>`; return } showPick(true) }
  function showPick(auto){
    if(ended||!videoWindowActive()){ timeUp(); return }
    stopPlayback(); const pick=pickOne();
    if(!pick){ inner.innerHTML=`<div class="empty">아직 영상이 없어요<br><small>인터넷이 연결되어 있는지, 폴더에 영상 파일이 있는지 확인해 주세요.</small></div>`; another.hidden=true; return }
    S.lastVideo=pick.key; save(); another.hidden=false;
    vmsg.textContent=`🎬 ${pick.title}${pick.kind==='yt'?' · Super Simple Songs':''}`;
    if(pick.kind==='yt'&&FILE_OPEN){ // no referrer from a double-clicked file, so the song opens on YouTube in a new tab
      inner.innerHTML=`<div class="empty" style="position:absolute;top:12px;left:0;right:0"><b style="font-size:1.3rem;font-family:var(--en)">${esc(pick.title)}</b><br><small>Super Simple Songs · ▶를 누르면 유튜브 새 창에서 나와요</small></div><div class="play" id="playO"><button id="playB" aria-label="유튜브에서 보기">▶</button></div>`;
      inner.querySelector('#playB').onclick=()=>{ SFX.pick(); window.open('https://www.youtube.com/watch?v='+encodeURIComponent(pick.id),'_blank','noopener'); vmsg.textContent=`🎬 ${pick.title} — 새 창에서 재생 중이에요. 다 보면 🎲 다른 영상을 눌러요.`; };
      return }
    if(pick.kind==='yt'){
      inner.innerHTML=`<div id="yt"></div>`+playOverlay(auto);
      const start=()=>{ const o=inner.querySelector('#playO'); if(o)o.remove();
        player=new YT.Player('yt',{videoId:pick.id,playerVars:{autoplay:1,rel:0,playsinline:1,controls:1,fs:0,iv_load_policy:3,disablekb:1,modestbranding:1},
          events:{ onReady:()=>{ fails=0; const sh=document.createElement('div'); sh.className='ytshield'; inner.appendChild(sh) },
                   onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED){ SFX.star(); showPick(true) } },
                   onError:()=>onFail() }}) };
      if(auto)start(); else inner.querySelector('#playB').onclick=()=>{ SFX.pick(); start() };
    } else {
      inner.innerHTML=`<video id="v" src="${esc(videoSrc(pick.file))}" playsinline preload="metadata" controlslist="nodownload noremoteplayback" disablepictureinpicture></video>`+playOverlay(auto);
      vEl=inner.querySelector('#v');
      const start=()=>{ vEl.play().then(()=>{ fails=0; const o=inner.querySelector('#playO'); if(o)o.remove(); vEl.controls=true }).catch(()=>{ if(auto){ inner.insertAdjacentHTML('beforeend',playOverlay(false)); inner.querySelector('#playB').onclick=()=>{SFX.pick();start()} } }) };
      vEl.addEventListener('ended',()=>{ SFX.star(); showPick(true) });
      vEl.addEventListener('error',()=>onFail());
      if(auto)start(); else inner.querySelector('#playB').onclick=()=>{ SFX.pick(); start() };
    }
  }
  ytOK=await loadYT();
  if(!ytOK&&!FILE_OPEN&&!videoPool().length){ inner.innerHTML=`<div class="empty">인터넷이 연결되어 있지 않아요<br><small>연결한 뒤 보물 상자를 다시 열어 주세요. 남은 시간은 계속 흘러요.</small></div>`; }
  else { showPick(false); if(FILE_OPEN)vmsg.textContent+=' — '+FILE_MSG; }
  // parent gate: a small sum a 7-year-old is unlikely to pass casually
  const qa=6+Math.floor(Math.random()*7), qb=7+Math.floor(Math.random()*6); app.querySelector('#gq').textContent=`${qa} + ${qb}`;
  app.querySelector('#gok').onclick=()=>{ if(parseInt(app.querySelector('#ga').value,10)!==qa+qb){SFX.no();return}
    app.querySelector('#gate').hidden=true; const pt=app.querySelector('#ptools'); pt.hidden=false; renderTools(pt); };
  function renderTools(pt){
    pt.innerHTML=`<p class="st">보물 상자(별 ${QUEST_GOAL}개)를 열면 <b>${VIDEO_MINUTES}분</b> 동안 영상을 볼 수 있어요. 시간이 끝나면 별 ${QUEST_GOAL}개를 다시 모아야 열려요.<br>
      영상은 폴더의 영상 파일 ${videoPool().length}편과 Super Simple Songs ${songPool().length}곡${ytOK?'':FILE_OPEN?' ('+FILE_MSG+')':' (지금은 인터넷이 안 돼서 꺼져 있어요)'} 중에서 랜덤으로 나와요.<br>
      폴더에 영상을 넣거나 뺀 뒤에는 <b>'영상목록 갱신.bat'</b>을 더블클릭해 주세요.</p>
      <div class="gate"><button class="ghost" id="pMore">${VIDEO_MINUTES}분 다시 주기</button><button class="ghost" id="pEnd">지금 끝내기</button></div>`;
    pt.querySelector('#pMore').onclick=()=>{ S.videoUntil=Date.now()+VIDEO_MINUTES*60000; save(); go(screenReward) };
    pt.querySelector('#pEnd').onclick=()=>{ S.videoUntil=0; save(); timeUp() };
  }
}

/* ---------- boot ---------- */
if(location.hash==='#reset'){ S={name:'',mon:'',stars:0,quests:0,custom:null,links:S.links}; try{localStorage.removeItem('mp_state')}catch(e){} history.replaceState(null,'',location.pathname); }
// every open starts fresh: name, monster, stars and quest progress all reset (custom monster and the remaining video time are kept)
S={name:'',mon:'',stars:0,quests:0,custom:S.custom,links:S.links,videoUntil:S.videoUntil,lastVideo:S.lastVideo}; save();
if(location.hash==='#treasure'){ // preview for parents: jump straight to a full treasure chest
  S.name='미리보기'; S.mon='bori'; S.stars=QUEST_GOAL; history.replaceState(null,'',location.pathname); screenReward(); }
else screenName();
</script>
