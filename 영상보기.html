<style>
/* A free-viewing page: no stars and no time limit. The same album frame as the treasure chest; pick at random or from the list below. */
:root{
  --bg:#fff7e0; --fg:#3b2a1a; --card:#ffffff; --muted:#8a6f52; --line:#e9d9b8;
  --accent:#ff7a3d; --accent2:#4fb3ff; --good:#4cc26e; --bad:#ff5c7a; --star:#ffc93c;
  --display:'Jua','Fredoka',system-ui,sans-serif; --en:'Fredoka','Jua',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;overflow-x:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--accent2);outline-offset:2px}
.screen{display:flex;flex-direction:column;gap:16px;max-width:900px;margin:0 auto;align-items:center}
h1{margin:0;font-weight:400;font-size:clamp(1.6rem,5vw,2.4rem);text-wrap:balance;text-align:center}
.top{display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap}
.top a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:1.1rem;background:var(--card);padding:8px 16px;border-radius:999px;box-shadow:0 3px 0 var(--line)}
  font-family:var(--en);font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.ghost{background:transparent;color:var(--muted);font-size:1.1rem;padding:8px 14px;border-radius:12px}
.ghost:active{background:#f3e5c8}
.msg{font-size:1.3rem;min-height:1.6em;text-align:center}
.frame{width:100%;max-width:720px;background:linear-gradient(135deg,#ffb347,#ff7a3d 40%,#ff5c7a);padding:14px;border-radius:30px;box-shadow:0 8px 0 #b8324d;position:relative}
.frame::before{content:"★ ★ ★";position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--star);color:#fff;padding:2px 16px;border-radius:999px;font-family:var(--en);font-size:1rem;letter-spacing:.2em}
.frame .inner{background:#1d1733;border-radius:18px;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;overflow:hidden;position:relative;color:#fff}
.frame video{width:100%;height:100%;object-fit:contain;display:block}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytshield{position:absolute;top:0;left:0;right:0;height:60px}
.frame .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(29,23,51,.55)}
.frame .play button{width:110px;height:110px;border-radius:50%;background:var(--star);font-size:3rem;box-shadow:0 6px 0 #c99a1c}
.frame .empty{padding:20px;font-size:1.2rem;line-height:1.5;text-align:center}
.big{min-height:64px;padding:12px 28px;border-radius:999px;background:var(--accent);color:#fff;font-size:1.4rem;box-shadow:0 6px 0 #c9541e;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c9541e}
.big.blue{background:var(--accent2);box-shadow:0 6px 0 #2b7fc0}.big.blue:active{box-shadow:0 2px 0 #2b7fc0}
.rowbtn{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.list{width:100%;max-width:720px;background:var(--card);border-radius:24px;padding:14px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px}
.list h2{margin:0;font-weight:400;font-size:1.3rem;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.list input{font:inherit;font-size:1.1rem;padding:8px 14px;border-radius:14px;border:3px solid var(--line);flex:1;min-width:160px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:46vh;overflow-y:auto;padding:2px}
.grid button{background:#fff7e0;border-radius:16px;padding:10px 8px;font-size:1rem;line-height:1.25;box-shadow:0 3px 0 var(--line);text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:3px solid transparent}
.grid button.on{border-color:var(--accent)}
.grid button small{font-family:var(--en);font-size:.75rem;color:var(--muted)}
.grid button .t{font-family:var(--en);font-weight:500}
.grid button.local .t{font-family:var(--display)}
.hint{color:var(--muted);font-size:1rem;text-align:center}
</style>
</head>

  <div class="list">

</div>

window.VIDEO_FILES=window.VIDEO_FILES||[];</script>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function videoPool(){ const list=Array.isArray(window.VIDEO_FILES)?window.VIDEO_FILES:[];
  return list.filter(f=>typeof f==='string'&&/\.(mp4|webm|m4v|mov|ogv)$/i.test(f)).map(f=>({kind:'file',file:f,key:f,title:f.replace(/^.*\//,'').replace(/\.[^.]+$/,'').replace(/[_]+/g,' ')})) }
function songPool(){ const list=Array.isArray(window.SSS_SONGS)?window.SSS_SONGS:[]; return list.filter(x=>x&&/^[\w-]{11}$/.test(x.id)).map(x=>({kind:'yt',id:x.id,key:'yt:'+x.id,title:x.t||'Super Simple Songs'})) }
function videoSrc(file){ return file.split('/').map(encodeURIComponent).join('/') }
let ytLoad=null;
const FILE_OPEN=location.protocol==='file:', FILE_MSG="틀 안에서 보려면 폴더의 '몬스터놀이터 열기.bat'를 먼저 켜 주세요. 켜져 있으면 이 페이지가 자동으로 넘어가요. 지금은 ▶를 누르면 유튜브 새 창에서 나와요."; // double-clicked file: YouTube refuses to play without a referrer (error 153)
if(FILE_OPEN){ // double-clicked file: if the local server from '몬스터놀이터 열기.bat' is running, hop over to it so YouTube can play inside the frame
  const target='http://localhost:8765/'+(location.pathname.split('/').pop()||'monster%20game.html')+location.hash;
  fetch('http://localhost:8765/videos.js?t='+Date.now(),{mode:'no-cors',cache:'no-store'}).then(()=>location.replace(target)).catch(()=>{});
}
function loadYT(){ if(FILE_OPEN)return Promise.resolve(false); if(ytLoad)return ytLoad; ytLoad=new Promise(res=>{ if(window.YT&&YT.Player)return res(true);
  const fail=()=>{ ytLoad=null; res(false) }; const t=setTimeout(fail,7000);
  window.onYouTubeIframeAPIReady=()=>{ clearTimeout(t); res(true) };
  const sc=document.createElement('script'); sc.src='https://www.youtube.com/iframe_api'; sc.onerror=()=>{ clearTimeout(t); fail() }; document.head.appendChild(sc); }); return ytLoad }

const inner=document.getElementById('inner'), vmsg=document.getElementById('vmsg'), grid=document.getElementById('grid'), q=document.getElementById('q'), count=document.getElementById('count');
let player=null, vEl=null, ytOK=false, last=null, fails=0, all=[];
function stopPlayback(){ try{ if(player&&player.destroy)player.destroy() }catch(e){} player=null; try{ if(vEl){ vEl.pause(); vEl.removeAttribute('src'); vEl.load() } }catch(e){} vEl=null; }
function pickRandom(){ if(!all.length)return null; let c=all; if(all.length>1&&last){ const f=all.filter(v=>v.key!==last); if(f.length)c=f } return c[Math.floor(Math.random()*c.length)] }
function playOverlay(auto){ return auto?'':`<div class="play" id="playO"><button id="playB" aria-label="재생">▶</button></div>` }
function onFail(){ fails++; if(fails>=4){ inner.innerHTML=`<div class="empty">영상을 열 수 없어요.<br><small>인터넷 연결과 폴더의 영상 파일을 확인해 주세요.</small></div>`; return } show(pickRandom(),true) }
function show(pick,auto){
  stopPlayback();
  if(!pick){ inner.innerHTML=`<div class="empty">아직 영상이 없어요<br><small>인터넷이 연결되어 있는지, 폴더에 영상 파일이 있는지 확인해 주세요.</small></div>`; return }
  last=pick.key; document.getElementById('next').hidden=false;
  grid.querySelectorAll('button.on').forEach(b=>b.classList.remove('on')); const on=grid.querySelector(`button[data-key="${CSS.escape(pick.key)}"]`); if(on){ on.classList.add('on') }
  vmsg.textContent=`🎬 ${pick.title}${pick.kind==='yt'?' · Super Simple Songs':''}`;
  if(pick.kind==='yt'&&FILE_OPEN){ // no referrer from a double-clicked file, so the song opens on YouTube in a new tab
    inner.innerHTML=`<div class="empty" style="position:absolute;top:12px;left:0;right:0"><b style="font-size:1.3rem;font-family:var(--en)">${esc(pick.title)}</b><br><small>Super Simple Songs · ▶를 누르면 유튜브 새 창에서 나와요</small></div><div class="play" id="playO"><button id="playB" aria-label="유튜브에서 보기">▶</button></div>`;
    inner.querySelector('#playB').onclick=()=>{ window.open('https://www.youtube.com/watch?v='+encodeURIComponent(pick.id),'_blank','noopener'); vmsg.textContent=`🎬 ${pick.title} — 새 창에서 재생 중이에요.`; };
    return }
  if(pick.kind==='yt'){
    inner.innerHTML=`<div id="yt"></div>`+playOverlay(auto);
    const start=()=>{ const o=inner.querySelector('#playO'); if(o)o.remove();
      player=new YT.Player('yt',{videoId:pick.id,playerVars:{autoplay:1,rel:0,playsinline:1,controls:1,fs:0,iv_load_policy:3,disablekb:1,modestbranding:1},
        events:{ onReady:()=>{ fails=0; const sh=document.createElement('div'); sh.className='ytshield'; inner.appendChild(sh) },
                 onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED)show(pickRandom(),true) },
                 onError:()=>onFail() }}) };
    if(auto)start(); else inner.querySelector('#playB').onclick=start;
  } else {
    inner.innerHTML=`<video id="v" src="${esc(videoSrc(pick.file))}" playsinline preload="metadata" controlslist="nodownload noremoteplayback" disablepictureinpicture></video>`+playOverlay(auto);
    vEl=inner.querySelector('#v');
    const start=()=>{ vEl.play().then(()=>{ fails=0; const o=inner.querySelector('#playO'); if(o)o.remove(); vEl.controls=true }).catch(()=>{ if(auto&&!inner.querySelector('#playO')){ inner.insertAdjacentHTML('beforeend',playOverlay(false)); inner.querySelector('#playB').onclick=start } }) };
    vEl.addEventListener('ended',()=>show(pickRandom(),true));
    vEl.addEventListener('error',()=>onFail());
    if(auto)start(); else inner.querySelector('#playB').onclick=start;
  }
}
function drawList(){ const f=q.value.trim().toLowerCase();
  const items=all.filter(v=>!f||v.title.toLowerCase().includes(f));
  count.textContent=`(${items.length}편)`;
  grid.innerHTML=items.map(v=>`<button data-key="${esc(v.key)}" class="${v.kind}"><span class="t">${esc(v.title)}</span>${v.kind==='yt'?'<small>Super Simple Songs</small>':'<small>폴더 영상</small>'}</button>`).join('')||'<div class="hint">찾는 영상이 없어요.</div>';
  grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const v=all.find(x=>x.key===b.dataset.key); if(v){ show(v,true); window.scrollTo({top:0,behavior:'smooth'}) } });
}
document.getElementById('random').onclick=()=>show(pickRandom(),true);
document.getElementById('next').onclick=()=>show(pickRandom(),true);
q.oninput=drawList;
(async()=>{
  ytOK=await loadYT();
  all=[...videoPool(),...((ytOK||FILE_OPEN)?songPool():[])];
  drawList();
  if(!ytOK&&!FILE_OPEN&&!videoPool().length){ inner.innerHTML=`<div class="empty">인터넷이 연결되어 있지 않아요<br><small>연결한 뒤 다시 열어 주세요.</small></div>`; return }
  if(!ytOK)vmsg.textContent=FILE_OPEN?FILE_MSG:'지금은 인터넷이 안 돼서 폴더 영상만 볼 수 있어요.';
  show(pickRandom(),false);
})();
</script>
